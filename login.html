<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Quality Point</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0A0A;
    --accent1: #FF2D8B;
    --accent2: #00C8FF;
    --text: #FFFDF0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .glow {
    position: absolute; width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(255,45,139,0.15), transparent 60%);
    filter: blur(40px); z-index: 0;
  }
  .login-box {
    position: relative; z-index: 1;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 50px 40px;
    border-radius: 24px;
    width: 100%; max-width: 400px;
    backdrop-filter: blur(20px);
    text-align: center;
  }
  h2 { font-weight: 800; font-size: 32px; margin-bottom: 8px; }
  p { color: rgba(255,255,255,0.5); font-size: 14px; margin-bottom: 32px; }
  
  .input-group { margin-bottom: 20px; text-align: left; }
  input {
    width: 100%; padding: 16px;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    color: white; font-family: 'Outfit';
    outline: none; transition: border 0.3s;
  }
  input:focus { border-color: var(--accent2); }
  
  button {
    width: 100%; padding: 16px;
    background: var(--accent1); color: white;
    border: none; border-radius: 12px;
    font-weight: 800; font-size: 16px; font-family: 'Outfit';
    cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
    margin-top: 10px;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(255,45,139,0.3); }
  
  #error-msg { color: #ff4d4d; font-size: 13px; margin-top: 16px; display: none; }
</style>
</head>
<body>

<div class="glow"></div>

<div class="login-box">
  <h2>Quality Point</h2>
  <p>Acesso restrito à biblioteca</p>
  
  <div class="input-group">
    <input type="email" id="email" placeholder="Seu e-mail corporativo">
  </div>
  <div class="input-group">
    <input type="password" id="password" placeholder="Sua senha">
  </div>
  
  <button id="login-btn">ENTRAR NO RADAR</button>
  <div id="error-msg">E-mail ou senha incorretos.</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBsF136lpHDCE62lVLoFK4K0FuxgpRUr6s",
    authDomain: "quality-point-finx.firebaseapp.com",
    projectId: "quality-point-finx",
    storageBucket: "quality-point-finx.firebasestorage.app",
    messagingSenderId: "400200617084",
    appId: "1:400200617084:web:3b834238653c34721dcdf9"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  onAuthStateChanged(auth, (user) => {
    if (user) { window.location.href = "index.html"; }
  });

  document.getElementById('login-btn').addEventListener('click', () => {
    const email = document.getElementById('email').value;
    const pass = document.getElementById('password').value;
    const errorMsg = document.getElementById('error-msg');

    signInWithEmailAndPassword(auth, email, pass)
      .then((userCredential) => {
        window.location.href = "index.html";
      })
      .catch((error) => {
        errorMsg.style.display = 'block';
        console.error("Erro no login:", error.message);
      });
  });
</script>
</body>
</html>
